  --bg:#050d1f; --bg2:#0a1a38; --card:#0d2145; --card2:#112a57; --line:#1d3b72;
  --txt:#eaf1ff; --mut:#93a8d1; --acc:#2f7bff; --acc2:#5cb6ff; --ok:#2fd08a; --bad:#ff6b6b; --warn:#ffcb5c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#10316b 0%,var(--bg) 60%) fixed,var(--bg);color:var(--txt);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center;padding:0 16px 40px}
.wrap{width:100%;max-width:720px}
header.top{display:flex;align-items:center;gap:12px;padding:16px 0}
header.top img{width:44px;height:44px;border-radius:10px}
header.top .brand{font-weight:700;letter-spacing:.04em}
header.top .brand small{display:block;font-weight:500;letter-spacing:0;color:var(--mut);font-size:13px}
.sp{flex:1}
.pill{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.pill:hover{border-color:var(--acc)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
h1{font-size:26px;line-height:1.25;margin:0 0 6px}
h2{font-size:21px;line-height:1.35;margin:0 0 16px}
p.lead{color:var(--mut);margin:0 0 20px}
.hero{text-align:center;margin-bottom:18px}
.hero img{width:132px;height:132px;border-radius:26px;box-shadow:0 0 0 1px var(--line),0 12px 40px rgba(47,123,255,.35)}
label{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px}
input[type=text],input[type=tel]{width:100%;background:#071531;border:1.5px solid var(--line);border-radius:12px;color:var(--txt);font-size:17px;padding:13px 14px;outline:none}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,123,255,.25)}
.phone{display:flex;align-items:stretch}
.phone span{display:flex;align-items:center;padding:0 12px;background:#0b2150;border:1.5px solid var(--line);border-right:0;border-radius:12px 0 0 12px;color:var(--acc2);font-weight:600}
.phone input{border-radius:0 12px 12px 0}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#3d88ff,#1f63e0);color:#fff;border:0;border-radius:12px;font-size:17px;font-weight:600;padding:14px 22px;cursor:pointer;width:100%;margin-top:20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--txt);width:auto;margin:0}
.btn.ghost:hover:not(:disabled){border-color:var(--acc)}
.row{display:flex;gap:12px}
.row .btn{margin-top:20px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.choice button{background:#071531;border:1.5px solid var(--line);color:var(--txt);border-radius:16px;padding:26px 10px;font-size:26px;font-weight:700;cursor:pointer}
.choice button small{display:block;font-size:13px;font-weight:500;color:var(--mut);margin-top:4px}
.choice button:hover{border-color:var(--acc);background:#0b2150}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.meta span{background:#071531;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mut)}
.bar{height:8px;background:#071531;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .25s}
.qhead{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px;margin:12px 0 8px}
.qtext{font-size:19px;line-height:1.45;margin:18px 0 18px;font-weight:600;user-select:none;-webkit-user-select:none}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#071531;border:1.5px solid var(--line);color:var(--txt);border-radius:14px;padding:14px;margin-bottom:10px;font-size:16.5px;cursor:pointer;user-select:none;-webkit-user-select:none}
.opt b{flex:none;width:30px;height:30px;border-radius:9px;background:var(--card2);color:var(--acc2);display:flex;align-items:center;justify-content:center;font-size:15px}
.opt:hover{border-color:var(--acc)}
.opt.sel{border-color:var(--acc2);background:#0e2a5e}
.opt.sel b{background:var(--acc);color:#fff}
.nav{display:flex;gap:12px;margin-top:8px}
.nav .btn{margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;margin-top:20px}
.grid button{height:38px;border-radius:10px;border:1.5px solid var(--line);background:#071531;color:var(--mut);font-size:14px;cursor:pointer}
.grid button.done{background:#10408a;color:#fff;border-color:#2760c4}
.grid button.cur{outline:2px solid var(--acc2);outline-offset:1px}
.note{color:var(--warn);font-size:14px;margin-top:12px}
.score{text-align:center;padding:8px 0 4px}
.ring{width:170px;height:170px;border-radius:50%;margin:6px auto 18px;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--acc2) calc(var(--p)*1%),#071531 0)}
.ring div{width:138px;height:138px;border-radius:50%;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring strong{font-size:38px;line-height:1}
.ring span{color:var(--mut);font-size:14px;margin-top:4px}
.ok{color:var(--ok)}
.dashrow{display:grid;grid-template-columns:80px 1fr 48px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.dashrow .b{height:12px;background:#071531;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.dashrow .b i{display:block;height:100%}
.dashrow em{font-style:normal;text-align:right;color:var(--mut)}
.weak{background:#2a1424;border:1px solid #6b2b45;border-radius:14px;padding:12px 14px;margin:10px 0}
.weak b{color:var(--bad)}
.weak .chips span{display:inline-block;background:#3a1a2e;border-radius:8px;padding:3px 9px;margin:6px 6px 0 0;font-size:14px;color:#ffd1d9}
.good{background:#0d2a28;border:1px solid #1d6b55;border-radius:14px;padding:12px 14px;margin:10px 0;color:var(--ok)}
.tabs{display:flex;gap:8px;margin:10px 0 14px}
.tabs .pill.on{background:var(--acc);border-color:var(--acc)}
.rv{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#071531}
.rv.bad{border-color:#8a3550}.rv.okc{border-color:#1d6b55}
.rv .q{font-weight:600;margin:0 0 10px}
.rv .o{padding:8px 10px;border-radius:10px;margin:5px 0;border:1px solid transparent;font-size:15px;color:var(--mut)}
.rv .o.c{background:#0d2a28;border-color:#1d6b55;color:#bff5dc}
.rv .o.w{background:#2a1424;border-color:#8a3550;color:#ffd1d9}
.rv .src{margin-top:8px;font-size:14px;color:var(--warn)}
.sec{margin-top:26px;text-align:left}
.hidden{display:none!important}
footer{color:var(--mut);font-size:13px;text-align:center;margin-top:22px}
@media(max-width:480px){.card{padding:18px}h1{font-size:23px}.qtext{font-size:18px}}
.choice svg{width:48px;height:32px;border-radius:4px;display:block;margin:0 auto 8px;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
</style>
</head>

const PROTECT = ["The Closer Survival Guide","How to Win Friends and Influence People","Influence: The Psychology of Persuasion","SPIN Selling","Need-payoff","Situation","Problem","Implication","SPIN","FAB","XYZ","CRM","VIP","SALES PRO","Sales Pro"];
const WORDS = {"Mercedes":"Мерседес","Cola":"Кола","Pepsi":"Пепси","Zoom":"Зум","Kartrij":"Картридж","kartrij":"картридж","Printer":"Принтер","printer":"принтер"};
const MAP = {a:"а",b:"б",d:"д",e:"е",f:"ф",g:"г",h:"ҳ",i:"и",j:"ж",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",q:"қ",r:"р",s:"с",t:"т",u:"у",v:"в",x:"х",y:"й",z:"з",c:"к",w:"в"};
const AP = "['’ʻʼ‘`]";
const RX = new RegExp("[oO]"+AP+"|[gG]"+AP+"|[sS][hH]|[cC][hH]|[yY][oO](?!"+AP+")|[yY][uU]|[yY][aA]|[yY][eE]|"+AP+"|[A-Za-z]","g");
function isLetter(c){return !!c && /\p{L}/u.test(c);}
function cased(src,cyr){
  if(src.length>1 && src===src.toUpperCase() && /[A-Za-z]/.test(src)) return cyr.toUpperCase();
  const f=src[0]; if(f!==f.toLowerCase()) return cyr.charAt(0).toUpperCase()+cyr.slice(1);
  return cyr;
}
function toCyr(str){
  const hold=[]; let t=String(str);
  Object.keys(WORDS).forEach(w=>{t=t.split(w).join(""+(hold.push(WORDS[w])-1)+"");});
  PROTECT.forEach(p=>{t=t.split(p).join(""+(hold.push(p)-1)+"");});
  t=t.replace(/ts(?=iya|ion)/g,"ц").replace(/Ts(?=iya|ion)/g,"Ц");
  t=t.replace(RX,(m,off,all)=>{
    const l=m.toLowerCase();
    if(/^o['’ʻʼ‘`]$/.test(l)) return cased(m,"ў");
    if(/^g['’ʻʼ‘`]$/.test(l)) return cased(m,"ғ");
    if(l==="sh") return cased(m,"ш");
    if(l==="ch") return cased(m,"ч");
    if(l==="yo") return cased(m,"ё");
    if(l==="yu") return cased(m,"ю");
    if(l==="ya") return cased(m,"я");
    if(l==="ye") return cased(m,"е");
    if(m.length===1 && /['’ʻʼ‘`]/.test(m)){
      if(!(isLetter(all[off-1]) && isLetter(all[off+1]))) return m;
      return (all[off-1]===all[off-1].toUpperCase() && all[off+1]===all[off+1].toUpperCase()) ? "Ъ" : "ъ";
    }
    if(l==="e"){
      const prev=all[off-1];
      return cased(m,(isLetter(prev) || prev==="'" || prev==="’")?"е":"э");
    }
    return cased(m,MAP[l]||m);
  });
  return t.replace(/(\d+)/g,(_,i)=>hold[+i]);
}

function shuffle(a){
  a=a.slice();
  const rnd=n=>{const b=new Uint32Array(1);if(window.crypto&&crypto.getRandomValues){crypto.getRandomValues(b);return b[0]%n;}return Math.floor(Math.random()*n);};
  for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function show(name){
  ["info","script","quiz","done"].forEach(k=>$("s-"+k).classList.toggle("hidden",k!==name));

  window.scrollTo(0,0);
}

  S.order.forEach((idx,pos)=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=pos+1;
    if(S.answers[idx]!==undefined) b.classList.add("done");
    if(pos===S.cur) b.classList.add("cur");
    b.addEventListener("click",()=>{S.cur=pos;save();renderQuiz();window.scrollTo(0,0);});
    g.appendChild(b);
  });
  tick();
}
$("prev").addEventListener("click",()=>{if(S.cur>0){S.cur--;save();renderQuiz();window.scrollTo(0,0);}});
let sending=false;
$("next").addEventListener("click",async()=>{
  if(S.cur<N-1){S.cur++;save();renderQuiz();window.scrollTo(0,0);return;}
  if(sending) return;
  sending=true; $("next").disabled=true; $("submitErr").textContent="";
  $("next").textContent=tr("Yuborilmoqda…");
  const ans={}; QUESTIONS.forEach((q,i)=>{ans[q.id]=S.answers[i];});
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),25000);
  try{
    const d=await gradeAndSend({name:S.name,phone:"+998"+S.phone.replace(/\D/g,""),script:S.script,answers:ans,
        seconds:Math.round((Date.now()-S.startedAt)/1000),tabs:S.tabs||0},ctl.signal);
    S.result={score:d.score,total:d.total,percent:d.percent,correct:d.correct,perVideo:d.perVideo};
    save(); show("done"); renderDone();
  }catch(e){
    $("submitErr").textContent=tr(e.message==="SOZLANMAGAN"?"Sayt sozlanmagan: Telegram bot ma'lumotlari kiritilmagan.":"Yuborib bo'lmadi. Internetni tekshirib, qayta urinib ko'ring. Javoblaringiz saqlangan.");
    renderQuiz();
  }finally{clearTimeout(to);sending=false;}
});
function tick(){
  if(S.screen!=="quiz"||!S.startedAt){return;}
  const s=Math.max(0,Math.round((Date.now()-S.startedAt)/1000));
  $("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
setInterval(tick,1000);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.screen==="quiz"){S.tabs=(S.tabs||0)+1;save();}});
document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest("#s-quiz"))e.preventDefault();});

/* ---------- 4: natija ---------- */
const fmt=t=>Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");
let revFilter="bad";
function renderDone(){
  const r=S.result||{score:0,total:N,percent:0};
  $("doneName").textContent=S.name;
  $("pct").textContent=r.percent+"%";
  $("frac").textContent=r.score+" / "+r.total;
  $("ring").style.setProperty("--p",r.percent);
  const m=r.percent>=85?"A'lo natija!":r.percent>=70?"Yaxshi natija!":r.percent>=50?"Qoniqarli. Videolarni qayta ko'rib chiqing.":"Videolarni diqqat bilan qayta ko'rib chiqing.";
  $("doneMsg").textContent=tr(m);
  $("fBad").textContent=tr("Faqat xatolar"); $("fAll").textContent=tr("Barcha savollar");
  $("fBad").classList.toggle("on",revFilter==="bad"); $("fAll").classList.toggle("on",revFilter==="all");
  const cor=r.correct||{};
  const wrong=(q,i)=>cor[q.id]!==undefined && S.answers[i]!==cor[q.id];
  // video tahlili
  const vids={}; QUESTIONS.forEach((q,i)=>{const v=vids[q.v]=vids[q.v]||{n:0,ok:0,bad:[]};v.n++; if(wrong(q,i)) v.bad.push(q.t); else v.ok++;});
  const dash=$("dash"); dash.innerHTML="";
  Object.keys(vids).sort((a,b)=>a-b).forEach(k=>{
    const v=vids[k], pc=v.ok/v.n*100, col=pc===100?"var(--ok)":pc>=60?"var(--warn)":"var(--bad)";
    const row=document.createElement("div"); row.className="dashrow";
    row.innerHTML='<span></span><div class="b"><i style="width:'+pc+'%;background:'+col+'"></i></div><em>'+v.ok+'/'+v.n+'</em>';
    row.firstChild.textContent=k+tr("-video");
    dash.appendChild(row);
  });
  const weakKeys=Object.keys(vids).filter(k=>vids[k].bad.length).sort((a,b)=>vids[b].bad.length-vids[a].bad.length||a-b);
  if(!weakKeys.length){const g=document.createElement("div");g.className="good";g.textContent=tr("Barcha videolar yaxshi o'zlashtirilgan. Tabriklaymiz!");dash.appendChild(g);}
  weakKeys.forEach(k=>{
    const v=vids[k], box=document.createElement("div"); box.className="weak";
    const h=document.createElement("div"); h.innerHTML="<b></b> <span></span>";
    h.firstChild.textContent=k+tr("-video: qayta ko'ring");
    h.lastChild.textContent=" ("+tr("xato")+": "+v.bad.length+")";
    box.appendChild(h);
    const ch=document.createElement("div"); ch.className="chips";
    [...new Set(v.bad)].sort((a,b)=>a-b).forEach(t=>{const sp=document.createElement("span");sp.textContent=fmt(Math.max(0,t-5))+" – "+fmt(t+75)+" "+tr("daqiqa");ch.appendChild(sp);});
    box.appendChild(ch); dash.appendChild(box);
  });
  // xatolar
  const rv=$("review"); rv.innerHTML="";
  let shown=0;
  S.order.forEach((qi,pos)=>{
    const q=QUESTIONS[qi], bad=wrong(q,qi);
    if(revFilter==="bad" && !bad) return;
    shown++;
    const d=document.createElement("div"); d.className="rv "+(bad?"bad":"okc");
    const h=document.createElement("p"); h.className="q"; h.textContent=(pos+1)+". "+tr(q.q); d.appendChild(h);
    S.perm[qi].forEach((orig,pp)=>{
      const o=document.createElement("div"); o.className="o";
      let tag="";
      if(orig===cor[q.id]){o.classList.add("c");tag="  ✓ "+tr("To'g'ri javob");}
      else if(orig===S.answers[qi]){o.classList.add("w");tag="  ✗ "+tr("Sizning javobingiz");}
      o.textContent=LET[pp]+") "+tr(q.o[orig])+tag; d.appendChild(o);
    });
    if(bad){const sr=document.createElement("div");sr.className="src";sr.textContent="▶ "+q.v+tr("-video, taxminan ")+fmt(Math.max(0,q.t-5))+" – "+fmt(q.t+75)+" "+tr("daqiqa");d.appendChild(sr);}
    rv.appendChild(d);
  });
  if(!shown){const g=document.createElement("div");g.className="good";g.textContent=tr("Xato yo'q. Barcha javoblar to'g'ri!");rv.appendChild(g);}
}
$("fBad").addEventListener("click",()=>{revFilter="bad";renderDone();});
$("fAll").addEventListener("click",()=>{revFilter="all";renderDone();});

/* ---------- Boshlash ---------- */
$("name").value=S.name||""; $("phone").value=S.phone||"";
if(S.screen==="quiz"&&!S.order) S.screen="info";
if(S.screen==="done"&&!S.result) S.screen="quiz";
applyScript();
show(S.screen);
if(S.screen==="quiz") renderQuiz();
if(S.screen==="done") renderDone();
</script>
</body>
</html>
